name: Build xiaozhi (lckfb szpi-esp32s3 + auto screen off)

# 只有手動按 Run workflow 才會編譯（上傳檔案不會自動觸發）
on:
  workflow_dispatch:
    inputs:
      emote:
        description: "大臉表情 UI（1=開, 0=關）"
        default: "1"
      ota_url:
        description: "OTA 伺服器位址（留空 = 用官方 xiaozhi.me）"
        default: "http://iot.bgiraffe.cc:18003/xiaozhi/ota/"

jobs:
  build:
    name: Build lichuang-dev (fork main)
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0.2

    steps:
      - name: Checkout this fork
        uses: actions/checkout@v4

      # 大臉表情 UI + OTA 位址（改板級 config.json）
      - name: Enable big-face emote UI + OTA URL
        if: ${{ (github.event.inputs.emote || '1') != '0' || github.event.inputs.ota_url }}
        shell: bash
        env:
          OTA_URL: ${{ github.event.inputs.ota_url }}
          EMOTE_ON: ${{ github.event.inputs.emote || '1' }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          ota = (os.environ.get("OTA_URL") or "").strip()
          p = pathlib.Path("main/boards/lckfb/szpi-esp32s3/config.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          for b in d["builds"]:
              if os.environ.get("EMOTE_ON", "1") != "0" and "CONFIG_USE_EMOTE_MESSAGE_STYLE=y" not in b["sdkconfig_append"]:
                  b["sdkconfig_append"].append("CONFIG_USE_EMOTE_MESSAGE_STYLE=y")
              if not ota:
                  b["sdkconfig_append"] = [x for x in b["sdkconfig_append"] if not x.startswith("CONFIG_OTA_URL=")]
              else:
                  line = f'CONFIG_OTA_URL="{ota}"'
                  b["sdkconfig_append"] = [x for x in b["sdkconfig_append"] if not x.startswith("CONFIG_OTA_URL=")]
                  b["sdkconfig_append"].append(line)
          p.write_text(json.dumps(d, indent=4, ensure_ascii=False) + "\n", encoding="utf-8")
          print(p.read_text(encoding="utf-8"))
          PY

      # 16k 音頻（輸入輸出必須相同，否則 duplex codec assert）
      - name: Set 16k audio sample rate
        shell: bash
        run: |
          f=main/boards/lckfb/szpi-esp32s3/config.h
          sed -i -E 's/(AUDIO_INPUT_SAMPLE_RATE[[:space:]]+)24000/\116000/' "$f"
          sed -i -E 's/(AUDIO_OUTPUT_SAMPLE_RATE[[:space:]]+)24000/\116000/' "$f"
          echo "---- audio rates ----"
          grep -n "SAMPLE_RATE" "$f"
          if ! grep -qE 'AUDIO_INPUT_SAMPLE_RATE[[:space:]]+16000' "$f" || \
             ! grep -qE 'AUDIO_OUTPUT_SAMPLE_RATE[[:space:]]+16000' "$f"; then
            echo "ERROR: sample rate patch failed"; exit 1
          fi

      # 相機工具：移出 HAVE_LVGL 守衛（emote UI 下 HAVE_LVGL 不再定義）
      - name: Enable camera tool with emote UI
        shell: bash
        run: |
          python3 patch/apply_camera_tool.py
          grep -n "camera tool moved out" main/mcp_server.cc | head -3

      # 常駐連線（server-switchable persist_ws）
      - name: Enable persistent WS mode (server-switchable)
        shell: bash
        run: |
          python3 patch/apply_persist_ws.py
          grep -n "persist_ws" main/application.cc | head -4

      # 熄屏時停下大臉渲染（省 CPU/SPI）
      - name: Stop rendering while screen off
        shell: bash
        run: |
          python3 patch/apply_render_sleep.py
          grep -n "emote_set_anim_visible" main/display/emote_display.cc

      - name: Build
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          python scripts/build.py lckfb/szpi-esp32s3 --name lichuang-dev
          ls -lh build/*.bin
          echo "=========== flash_args ==========="
          cat build/flash_args || true

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-lichuang-dev-screenoff
          path: |
            build/merged-binary.bin
            build/xiaozhi.bin
            build/expression_assets.bin
            build/flash_args
          if-no-files-found: warn
